name: Test

on:
  pull_request:
  # The release calls this first, so a push to main runs it once.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The tests make commits in throwaway repositories.
      - run: |
          git config --global user.name "Graft tests"
          git config --global user.email "tests@example.com"
      - run: make check
