# Builds a released tag: the runner image, pushed as ghcr.io/orchard-suite/graft:<version>,
# signed with cosign keyless as this workflow's GitHub identity, with a syft
# SBOM attested.
# The release workflow calls this with the tag it just cut; a dispatch rebuilds
# an existing tag.
name: Build

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.2.3
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: read
  packages: write
  # Needed to get an OIDC token for keyless signing.
  id-token: write

env:
  IMAGE: ghcr.io/orchard-suite/graft

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # A hosted runner's disk does not hold the image twice over, as the
      # SBOM's scan needs, beside the toolchains it ships; this job uses
      # none of them.
      - name: Make room for the image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Version from tag
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # By digest only: the tags come last, once the image is signed.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      # Sign and attest by digest, never by tag: a tag can move.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest the SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          syft "registry:${IMAGE}@${DIGEST}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"
      - name: Verify what was published
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/'
          cosign verify-attestation "${IMAGE}@${DIGEST}" --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' > /dev/null
      # Last: whatever follows the version tags sees one only once the image
      # it names is signed and verified.
      - name: Tag the version
        run: |
          tag() {
            ref=$1; shift
            for t in "$@"; do
              docker buildx imagetools create --tag "$t" "$ref"
              got=$(docker buildx imagetools inspect "$t" --format '{{json .Manifest.Digest}}' | tr -d '"')
              [ "$got" = "${ref#*@}" ] || { echo "$t is $got, not the signed ${ref#*@}" >&2; exit 1; }
            done
          }
          tag "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}" "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
